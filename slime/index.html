<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>ASMR Slime v3.2</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; }
        h1 { font-weight: 300; letter-spacing: 2px; margin: 0; font-size: 1.2rem; color: #0f4; }
        #log { position: absolute; bottom: 20px; left: 20px; font-size: 0.6rem; color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id='ui'><h1>ASMR Slime v3.2</h1></div>
    <div id='log'>Initialisiere...</div>
    <canvas id='canvas'></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const log = (m) => { document.getElementById('log').innerText = m; };
        
        let gl = canvas.getContext('webgl2', { alpha: false, depth: false });
        if (!gl) gl = canvas.getContext('webgl');
        
        if (!gl) {
            log('FEHLER: WebGL nicht verfügbar.');
        } else {
            log('Simulation aktiv (' + gl.getParameter(gl.VERSION) + ')');
            gl.getExtension('EXT_color_buffer_float');
            gl.getExtension('OES_texture_float_linear');
        }

        const vs = '#version 300 es\nlayout(location=0) in vec2 p; out vec2 vUv; void main(){ vUv=p*0.5+0.5; gl_Position=vec4(p,0,1); }';
        function createProg(fs) {
            const v = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(v, vs); gl.compileShader(v);
            const f = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(f, fs); gl.compileShader(f);
            const p = gl.createProgram(); gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
            return p;
        }

        const splatP = createProg('#version 300 es\nprecision highp float; uniform sampler2D t; uniform float a; uniform vec2 p; uniform vec3 c; in vec2 vUv; out vec4 o; void main(){ vec2 d=vUv-p; d.x*=a; o=texture(t,vUv)+vec4(exp(-dot(d,d)/0.001)*c, 0); }');
        const advectP = createProg('#version 300 es\nprecision highp float; uniform sampler2D uV; uniform sampler2D uS; uniform vec2 s; uniform float f; in vec2 vUv; out vec4 o; void main(){ vec2 c=vUv-0.016*texture(uV,vUv).xy*s; o=f*texture(uS,c); }');
        const renderP = createProg('#version 300 es\nprecision highp float; uniform sampler2D uD; in vec2 vUv; out vec4 o; void main(){ vec3 c=texture(uD,vUv).rgb; o=vec4(c*1.5+vec3(0.05,0.05,0.1), 1.0); }');

        function createFBO(w, h) {
            const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE){
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
            }
            const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
            return { tex, fbo };
        }

        let density = { r: createFBO(512, 512), w: createFBO(512, 512), swap() { let t=this.r; this.r=this.w; this.w=t; } };
        const quadVAO = gl.createVertexArray(); gl.bindVertexArray(quadVAO);
        const quadBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        function splat(x, y, color) {
            gl.useProgram(splatP);
            gl.uniform1f(gl.getUniformLocation(splatP, 'a'), canvas.width/canvas.height);
            gl.uniform2f(gl.getUniformLocation(splatP, 'p'), x, y);
            gl.uniform3f(gl.getUniformLocation(splatP, 'c'), color.r, color.g, color.b);
            gl.viewport(0,0,512,512); gl.bindFramebuffer(gl.FRAMEBUFFER, density.w.fbo);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, density.r.tex);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); density.swap();
        }

        function update() {
            if(canvas.width!==window.innerWidth){canvas.width=window.innerWidth; canvas.height=window.innerHeight;}
            gl.viewport(0,0,canvas.width,canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.useProgram(renderP);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, density.r.tex);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(update);
        }

        canvas.addEventListener('mousedown', e => splat(e.clientX/canvas.width, 1-e.clientY/canvas.height, {r:0,g:1,b:0.5}));
        canvas.addEventListener('mousemove', e => { if(e.buttons>0) splat(e.clientX/canvas.width, 1-e.clientY/canvas.height, {r:0,g:1,b:0.5}); });
        update();
    </script>
</body>
</html>
