<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>ASMR Slime v3.5 Titan</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: white; font-family: monospace; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; background: #200; }
        #overlay { position: absolute; top: 0; left: 0; padding: 10px; background: rgba(0,0,0,0.5); pointer-events: none; font-size: 10px; z-index: 100; max-height: 100%; overflow: hidden; }
        #ui { position: absolute; top: 20px; right: 20px; pointer-events: none; text-align: right; }
        h1 { font-weight: 300; letter-spacing: 2px; margin: 0; font-size: 1.2rem; color: #0f4; }
    </style>
</head>
<body>
    <div id='overlay'>Warte auf System-Start...</div>
    <div id='ui'><h1>ASMR Slime v3.5</h1></div>
    <canvas id='canvas'></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('overlay');
        const log = (m) => { console.log(m); overlay.innerHTML += '<div>' + m + '</div>'; };
        window.onerror = (e) => log('FATAL ERROR: ' + e);
        log('Lade Slime Engine v3.5...');

        let gl = canvas.getContext('webgl2', { alpha: false, depth: false, antialias: false });
        let isWebGL2 = true;
        if (!gl) {
            log('WebGL2 nicht verfügbar, versuche WebGL1...');
            gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            isWebGL2 = false;
        }

        if (!gl) {
            log('KRITISCH: WebGL wird von diesem Browser blockiert!');
            document.body.style.background = 'red';
        } else {
            log('Kontext bereit: ' + (isWebGL2 ? 'WebGL 2.0' : 'WebGL 1.0'));
        }

        const vsSource = isWebGL2 ? 
            '#version 300 es\nlayout(location=0) in vec2 p; out vec2 vUv; void main(){ vUv=p*0.5+0.5; gl_Position=vec4(p,0,1); }' :
            'attribute vec2 p; varying vec2 vUv; void main(){ vUv=p*0.5+0.5; gl_Position=vec4(p,0,1); }';

        const fsHeader = isWebGL2 ? 
            '#version 300 es\nprecision highp float; in vec2 vUv; out vec4 o;' :
            'precision highp float; varying vec2 vUv;';
        
        const outColor = isWebGL2 ? 'o' : 'gl_FragColor';
        const texFunc = isWebGL2 ? 'texture' : 'texture2D';

        function createProg(name, fsBody) {
            log('Kompiliere Shader: ' + name);
            const v = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(v, vsSource);
            gl.compileShader(v);
            if (!gl.getShaderParameter(v, gl.COMPILE_STATUS)) log('VS Error ('+name+'): ' + gl.getShaderInfoLog(v));
            const f = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(f, fsHeader + fsBody);
            gl.compileShader(f);
            if (!gl.getShaderParameter(f, gl.COMPILE_STATUS)) log('FS Error ('+name+'): ' + gl.getShaderInfoLog(f));
            const p = gl.createProgram();
            gl.attachShader(p, v);
            gl.attachShader(p, f);
            gl.linkProgram(p);
            if (!gl.getProgramParameter(p, gl.LINK_STATUS)) log('Link Error ('+name+'): ' + gl.getProgramInfoLog(p));
            return p;
        }

        const splatP = createProg('Splat', 'uniform sampler2D t; uniform float a; uniform vec2 p; uniform vec3 c; void main() { vec2 d = vUv - p; d.x *= a; float s = exp(-dot(d, d) / 0.002); '+outColor+' = '+texFunc+'(t, vUv) + vec4(s * c, 0.0); }');
        const advectP = createProg('Advect', 'uniform sampler2D uV; uniform sampler2D uS; uniform vec2 s; void main() { vec2 coord = vUv - 0.01 * ('+texFunc+'(uV, vUv).xy - 0.5) * s; '+outColor+' = '+texFunc+'(uS, coord) * 0.98; }');
        const renderP = createProg('Render', 'uniform sampler2D uD; void main() { vec3 c = '+texFunc+'(uD, vUv).rgb; '+outColor+' = vec4(c * 1.5 + vec3(0.05, 0.05, 0.1), 1.0); }');

        function createFBO(w, h) {
            const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            const fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
            gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
            return { tex, fbo, w, h };
        }

        const density = { r: createFBO(512, 512), w: createFBO(512, 512), swap() { let t=this.r; this.r=this.w; this.w=t; } };
        const velocity = { r: createFBO(128, 128), w: createFBO(128, 128), swap() { let t=this.r; this.r=this.w; this.w=t; } };

        const quadBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
        if (isWebGL2) { gl.bindVertexArray(gl.createVertexArray()); }
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

        function splat(x, y, dx, dy, color) {
            gl.viewport(0, 0, 512, 512); gl.useProgram(splatP);
            gl.uniform1f(gl.getUniformLocation(splatP, 'a'), canvas.width / canvas.height);
            gl.uniform2f(gl.getUniformLocation(splatP, 'p'), x, y);
            gl.uniform3f(gl.getUniformLocation(splatP, 'c'), color.r, color.g, color.b);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, density.r.tex);
            gl.bindFramebuffer(gl.FRAMEBUFFER, density.w.fbo); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); density.swap();
            gl.viewport(0, 0, 128, 128); gl.bindTexture(gl.TEXTURE_2D, velocity.r.tex);
            gl.uniform3f(gl.getUniformLocation(splatP, 'c'), dx + 0.5, dy + 0.5, 0.0);
            gl.bindFramebuffer(gl.FRAMEBUFFER, velocity.w.fbo); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); velocity.swap();
        }

        let lastX = 0.5, lastY = 0.5;
        function update() {
            if (canvas.width !== window.innerWidth) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            gl.useProgram(advectP); gl.viewport(0, 0, 512, 512);
            gl.uniform2f(gl.getUniformLocation(advectP, 's'), 1/512, 1/512);
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, velocity.r.tex);
            gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, density.r.tex);
            gl.uniform1i(gl.getUniformLocation(advectP, 'uV'), 0); gl.uniform1i(gl.getUniformLocation(advectP, 'uS'), 1);
            gl.bindFramebuffer(gl.FRAMEBUFFER, density.w.fbo); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); density.swap();
            gl.viewport(0, 0, canvas.width, canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.useProgram(renderP); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, density.r.tex);
            gl.uniform1i(gl.getUniformLocation(renderP, 'uD'), 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(update);
        }

        canvas.addEventListener('mousemove', e => {
            const x = e.clientX / canvas.width, y = 1.0 - e.clientY / canvas.height;
            if (e.buttons > 0) splat(x, y, (x - lastX) * 20, (y - lastY) * 20, { r: 0.1, g: 0.8, b: 0.4 });
            lastX = x; lastY = y;
        });
        log('Simulation läuft.');
        for(let i=0; i<10; i++) splat(Math.random(), Math.random(), 0, 0, {r: Math.random(), g: Math.random(), b: Math.random()});
        requestAnimationFrame(update);
    </script>
</body>
</html>
