<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>ASMR Slime v3.6 Test</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: yellow !important; font-family: sans-serif; }
        #log { position: absolute; top: 10px; left: 10px; background: black; color: white; padding: 15px; z-index: 1000; font-size: 14px; }
        canvas { display: block; width: 100vw; height: 100vh; background: #000; }
    </style>
</head>
<body>
    <div id='log'>v3.6 lädt... falls du kein GELB siehst, bitte Cache leeren!</div>
    <canvas id='canvas'></canvas>
    <script>
        const log = (m) => { document.getElementById('log').innerText += '\n' + m; };
        try {
            const canvas = document.getElementById('canvas');
            const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            if (!gl) {
                log('FEHLER: WebGL nicht verfügbar.');
                document.body.style.background = 'red';
            } else {
                log('WebGL OK: ' + gl.getParameter(gl.VERSION));
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                
                function draw() {
                    gl.viewport(0, 0, canvas.width, canvas.height);
                    gl.clearColor(0, 0.5, 0.1, 1); // Dunkelgrün
                    gl.clear(gl.COLOR_BUFFER_BIT);
                    requestAnimationFrame(draw);
                }
                draw();
                log('Simulation läuft (Grüner Schirm).');
            }
        } catch(e) { log('CRASH: ' + e.message); }
    </script>
</body>
</html>
