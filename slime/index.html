<!DOCTYPE html>
<html>
<head>
    <title>ASMR Slime v3.4</title>
    <style>body{margin:0;background:#050505;overflow:hidden;}canvas{width:100vw;height:100vh;display:block;}</style>
</head>
<body>
    <canvas id='c'></canvas>
    <script>
        const c=document.getElementById('c');
        const gl=c.getContext('webgl2',{alpha:false});
        if(!gl) alert('No WebGL2');
        gl.getExtension('EXT_color_buffer_float');
        const vs=`#version 300 es
layout(location=0) in vec2 p; out vec2 vUv; void main(){vUv=p*0.5+0.5;gl_Position=vec4(p,0,1);}`;
        function prog(fs){
            const s=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;};
            const p=gl.createProgram();gl.attachShader(p,s(gl.VERTEX_SHADER,vs));gl.attachShader(p,s(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);return p;
        }
        const splatP=prog(`#version 300 es
precision highp float;uniform sampler2D t;uniform vec2 p;uniform vec3 c;in vec2 vUv;out vec4 o;void main(){float s=exp(-dot(vUv-p,vUv-p)/0.002);o=texture(t,vUv)+vec4(s*c,0);}`);
        const renderP=prog(`#version 300 es
precision highp float;uniform sampler2D t;in vec2 vUv;out vec4 o;void main(){o=vec4(texture(t,vUv).rgb*1.5+vec3(0.05,0.05,0.1),1);}`);
        function fbo(w,h){
            const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
            gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
            gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
            const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);
            gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
            return {t,f};
        }
        let d={r:fbo(512,512),w:fbo(512,512),swap(){let t=this.r;this.r=this.w;this.w=t;}};
        const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
        function splat(x,y,clr){
            gl.viewport(0,0,512,512);gl.useProgram(splatP);gl.uniform2f(gl.getUniformLocation(splatP,'p'),x,y);gl.uniform3f(gl.getUniformLocation(splatP,'c'),clr.r,clr.g,clr.b);
            gl.bindFramebuffer(gl.FRAMEBUFFER,d.w.f);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,d.r.t);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);d.swap();
        }
        function draw(){
            c.width=window.innerWidth;c.height=window.innerHeight;gl.viewport(0,0,c.width,c.height);gl.bindFramebuffer(gl.FRAMEBUFFER,null);
            gl.useProgram(renderP);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,d.r.t);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
            requestAnimationFrame(draw);
        }
        c.onmousemove=e=>splat(e.clientX/c.width,1-e.clientY/c.height,{r:0.1,g:0.8,b:0.4});
        draw();
    </script>
</body>
</html>
