<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: orange; margin: 0; color: white; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; background: pink; }
        #status { position: absolute; top: 0; left: 0; background: rgba(0,0,0,0.8); padding: 20px; z-index: 100; }
    </style>
</head>
<body>
    <div id='status'>
        <h2>Diagnose v1.7</h2>
        <div id='log'>Warte auf Skript...</div>
    </div>
    <canvas id='canvas'></canvas>
    <script>
        const log = (m) => { document.getElementById('log').innerHTML += '<br>' + m; console.log(m); };
        window.onload = () => {
            log('Skript geladen.');
            const canvas = document.getElementById('canvas');
            
            // Test 1: 2D Context
            const ctx = canvas.getContext('2d');
            if (ctx) {
                log('2D Context OK.');
                ctx.fillStyle = 'blue';
                ctx.fillRect(10, 10, 100, 100);
                ctx.fillStyle = 'white';
                ctx.font = '30px Arial';
                ctx.fillText('JS & 2D OK', 20, 50);
            }

            // Test 2: WebGL
            log('Suche WebGL...');
            const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
            if (!gl) {
                log('<b style="color:red">FEHLER: Kein WebGL verfügbar!</b>');
                return;
            }
            log('WebGL OK: ' + gl.getParameter(gl.VERSION));
            
            try {
                gl.clearColor(0, 1, 0, 1); // GRÜN
                gl.clear(gl.COLOR_BUFFER_BIT);
                log('<b style="color:green">ERFOLG: WebGL hat GRÜN gezeichnet!</b>');
            } catch(e) {
                log('FEHLER beim Zeichnen: ' + e.message);
            }
        };
    </script>
</body>
</html>
