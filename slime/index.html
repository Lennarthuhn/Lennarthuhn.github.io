<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>ASMR Slime 2D v2.1</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0510; color: white; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; }
        h1 { font-weight: 300; letter-spacing: 2px; opacity: 0.9; margin: 0; font-size: 1.2rem; color: #00ffaa; }
        p { font-size: 0.7rem; opacity: 0.6; margin: 5px 0; }
        .ver { font-size: 0.6rem; color: #ff00ff; }
        .controls { margin-top: 10px; display: flex; gap: 8px; pointer-events: auto; }
        button { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
        button:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div id='ui'>
        <h1>ASMR Slime 2D</h1>
        <p>Tippe oder klicke für Schleim-Splats!</p>
        <span class='ver'>Version 2.1 (No-WebGL Mode)</span>
        <div class='controls'>
            <button onclick='randomSplats()'>Zufall</button>
            <button onclick='location.reload(true)'>Hard Reload</button>
        </div>
    </div>
    <canvas id='canvas'></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, c) {
                this.x = x; this.y = y;
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 4 + 1;
                this.vx = Math.cos(ang) * spd;
                this.vy = Math.sin(ang) * spd;
                this.size = Math.random() * 30 + 10;
                this.life = 1.0;
                this.c = c;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.97; this.vy *= 0.97;
                this.life -= 0.01;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * (0.5 + this.life * 0.5), 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + this.c.r + ',' + this.c.g + ',' + this.c.b + ',' + (this.life * 0.7) + ')';
                ctx.fill();
            }
        }

        function createSplat(x, y, count = 12) {
            const colors = [
                {r:0, g:255, b:150}, {r:255, g:50, b:200}, {r:50, g:150, b:255}, {r:255, g:255, b:50}
            ];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for(let i=0; i<count; i++) particles.push(new Particle(x, y, color));
        }

        function animate() {
            ctx.fillStyle = 'rgba(10, 5, 16, 0.2)'; // Lila Trails
            ctx.fillRect(0, 0, w, h);
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousedown', e => createSplat(e.clientX, e.clientY, 20));
        canvas.addEventListener('mousemove', e => { if(e.buttons > 0) createSplat(e.clientX, e.clientY, 2); });
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            for(let t of e.touches) createSplat(t.clientX, t.clientY, 10);
        }, {passive: false});

        window.randomSplats = () => {
            for(let i=0; i<5; i++) createSplat(Math.random()*w, Math.random()*h, 15);
        };

        createSplat(w/2, h/2, 30);
        animate();
        console.log('v2.1 running');
    </script>
</body>
</html>
